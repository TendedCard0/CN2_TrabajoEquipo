{% extends 'base.html' %}

{% block title %}
Agregar Vehículo
{% endblock %}

{% block content %}
<section class="max-w-2xl mx-auto mb-10">
    
    <!-- ENCABEZADO -->
    <div class="mb-8 text-center">
        <h2 class="text-3xl md:text-4xl font-black tracking-tight text-slate-950">
            Agregar nuevo 
            <span class="text-red-600">vehículo</span>
        </h2>
        <p class="text-slate-500 mt-2 text-lg">
            Completa los datos para registrar un vehículo en el catálogo.
        </p>
    </div>

    <!-- FORMULARIO -->
    <div class="bg-white rounded-3xl p-8 border border-slate-200 shadow-sm">
        <form action="{{ url_for('crear_vehiculo') }}" method="POST" class="space-y-6">

            <!-- MARCA -->
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Marca</label>
                <div class="relative">
                    <select name="marca_id" required 
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 px-4 outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100 transition appearance-none">
                        <option value="" disabled selected>Selecciona una marca...</option>
                        {% for marca in marcas %}
                            <option value="{{ marca.id }}">{{ marca.nombre }}</option>
                        {% endfor %}
                    </select>
                    <!-- Flecha personalizada para el select -->
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-500">
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>
                </div>
            </div>

            <!-- MODELO -->
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Modelo</label>
                <input type="text" name="modelo" placeholder="Ej. Civic, Corolla, Mustang" required 
                       class="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 px-4 outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100 transition">
            </div>

            <!-- AÑO -->
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Año</label>
                <input type="number" name="anio" placeholder="Ej. 2024" required 
                       class="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 px-4 outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100 transition">
            </div>

            <!-- PRECIO -->
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Precio ($)</label>
                <input type="number" step="0.01" name="precio" placeholder="Ej. 250000.00" required 
                       class="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 px-4 outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100 transition">
            </div>

            <!-- IMAGEN URL -->
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">URL de la Imagen (Opcional)</label>
                <input type="url" name="imagen_url" placeholder="https://ejemplo.com/imagen.jpg" 
                       class="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 px-4 outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100 transition">
            </div>

            <!-- BOTONES -->
            <div class="pt-4 flex flex-col sm:flex-row gap-4">
                <button type="submit" 
                        class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition shadow-lg shadow-blue-500/20 active:scale-95">
                    <i class="fa-solid fa-floppy-disk mr-2"></i> Guardar Vehículo
                </button>
                <a href="{{ url_for('index') }}" 
                   class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 px-4 rounded-xl text-center transition">
                    Cancelar
                </a>
            </div>

        </form>
    </div>
</section>
{% endblock %}
